name: Update draw history

# Every Saturday after the 20:35 KST draw (and again Sunday morning as a fallback),
# refresh www/draws.js so the next build ships with the newest results.
on:
  schedule:
    - cron: '30 13 * * 6'   # Sat 22:30 KST
    - cron: '0 0 * * 0'     # Sun 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-draws.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- www/draws.js; then echo "No new draws."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/draws.js
          git commit -m "Update draw history"
          git push
