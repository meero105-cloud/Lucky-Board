name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets (see README.md)."
            exit 1
          fi

      - name: Install packages
        run: npm install

      - name: Refresh bundled draw history
        run: npm run update:draws || echo "::warning::Could not refresh draws; building with the committed copy."

      - name: Create Android project
        run: npx cap add android

      - name: Generate icon and splash
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#0c1322' --iconBackgroundColorDark '#0c1322'
          --splashBackgroundColor '#0c1322' --splashBackgroundColorDark '#0c1322'

      - name: Set version, signing and links
        run: npm run android:configure
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android/app/upload.jks

      - name: Build AAB and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: luckyboard-build-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
